name: Shuiyong
options:
  bundleIdPrefix: com.shuiyong
  deploymentTarget:
    iOS: "15.0"
  # 与 GitHub macos-14 / Xcode 15.4 对齐，避免 objectVersion 77
  xcodeVersion: "15.0"
  objectVersion: 56
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.shuiyong.ports
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_BITCODE: NO

targets:
  Shuiyong:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources/Assets.xcassets
    settings:
      base:
        INFOPLIST_GENERATION_MODE: Generated
        PRODUCT_NAME: 水溶C
        PRODUCT_BUNDLE_IDENTIFIER: com.shuiyong.ports
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 水溶C
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_ENTITLEMENTS: entitlements/App.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: App/PrivateAPI/Shuiyong-Bridging-Header.h
        CLANG_ENABLE_MODULES: YES
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/App/PrivateAPI"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    # 注意：ShuiyongMem 绝不能 link/embed 进主 App（constructor 会钩 dyld，主程序秒闪）
    dependencies:
      - target: ShuiyongTunnel
        embed: true

  ShuiyongTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: ShuiyongTunnel
        PRODUCT_BUNDLE_IDENTIFIER: com.shuiyong.ports.tunnel
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 链路
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
        INFOPLIST_KEY_NSExtension_NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
        CODE_SIGN_ENTITLEMENTS: entitlements/Tunnel.entitlements

  ShuiyongMem:
    type: library.dynamic
    platform: iOS
    sources:
      - path: MemDylib
        excludes:
          - README.md
    settings:
      base:
        PRODUCT_NAME: ShuiyongMem
        PRODUCT_BUNDLE_IDENTIFIER: com.shuiyong.ports.mem
        EXECUTABLE_PREFIX: ""
        MACH_O_TYPE: mh_dylib
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        CLANG_ENABLE_MODULES: YES
        OTHER_LDFLAGS:
          - "-framework"
          - Foundation
          - "-framework"
          - UIKit
          - "-lpthread"

schemes:
  Shuiyong:
    build:
      targets:
        ShuiyongMem: all
        ShuiyongTunnel: all
        Shuiyong: all
    run:
      config: Release
    archive:
      config: Release
