name: 水溶C tipa

on:
  workflow_dispatch:
  push:
    paths:
      - "Shuangji/Shuangji.iOS/**"
      - ".github/workflows/shuiyong-tipa.yml"

jobs:
  tipa:
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Shuangji/Shuangji.iOS
        shell: bash
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install tools
        run: |
          set -e
          brew untap aws/tap 2>/dev/null || true
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1

          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen || true
          fi
          if ! command -v xcodegen >/dev/null 2>&1; then
            echo "fallback: download XcodeGen"
            VER=2.42.0
            curl -fsSL -o /tmp/xcodegen.zip \
              "https://github.com/yonaskolb/XcodeGen/releases/download/${VER}/xcodegen.zip"
            rm -rf /tmp/xcodegen && mkdir -p /tmp/xcodegen
            unzip -qo /tmp/xcodegen.zip -d /tmp/xcodegen
            sudo cp /tmp/xcodegen/bin/xcodegen /usr/local/bin/xcodegen
            sudo chmod +x /usr/local/bin/xcodegen
          fi
          xcodegen --version

          if ! command -v ldid >/dev/null 2>&1; then
            brew install ldid || brew install ldid-procursus || true
          fi
          if ! command -v ldid >/dev/null 2>&1; then
            echo "fallback: download ldid"
            curl -fsSL -o /tmp/ldid \
              "https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_x86_64" \
              || curl -fsSL -o /tmp/ldid \
              "https://raw.githubusercontent.com/ProcursusTeam/ldid/master/ldid"
            sudo cp /tmp/ldid /usr/local/bin/ldid
            sudo chmod +x /usr/local/bin/ldid
          fi
          command -v ldid

      - name: Package tipa
        run: |
          chmod +x package.sh
          ./package.sh

      - name: Upload tipa
        uses: actions/upload-artifact@v4
        with:
          name: shuiyong-tipa
          path: Shuangji/Shuangji.iOS/dist/*.tipa
          if-no-files-found: error
